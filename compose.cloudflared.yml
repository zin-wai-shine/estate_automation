services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - --protocol
      - http2
      - --metrics
      - 0.0.0.0:2000
      - run
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      - bolthaven_net

networks:
  bolthaven_net:
    name: bolthaven_net
    external: true
