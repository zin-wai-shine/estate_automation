<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BoltHaven Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 14px;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 12px;
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: #06b6d4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #0f172a;
      font-size: 14px;
    }
    .title { font-size: 14px; font-weight: 600; color: #f8fafc; }
    .subtitle { font-size: 11px; color: #94a3b8; }
    .card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #334155;
    }
    .card-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #64748b; font-weight: 600; margin-bottom: 6px; }
    .status-row { display: flex; align-items: center; justify-content: space-between; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }
    .groups-list { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; margin-top: 8px; }
    .group-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background: #0f172a;
      border-radius: 6px;
      font-size: 12px;
    }
    .group-tag { display: flex; align-items: center; gap: 6px; font-weight: 500; }
    .group-color { width: 8px; height: 8px; border-radius: 50%; }
    .btn {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #06b6d4;
      color: #0f172a;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }
    .btn:hover { background: #0891b2; color: #ffffff; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-badge">BH</div>
    <div>
      <div class="title">BoltHaven Companion</div>
      <div class="subtitle">External Browser Integration</div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Current Chrome Profile</div>
    <div class="status-row">
      <strong id="profile-name">Connecting...</strong>
      <span class="badge"><span class="badge-dot"></span> Authorized</span>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Discovered Tab Groups</div>
    <div class="groups-list" id="groups-container">
      <div style="color: #64748b; font-size: 11px;">Scanning open tab groups...</div>
    </div>
  </div>

  <button class="btn" id="sync-btn">Sync to BoltHaven</button>

  <script src="popup.js"></script>
</body>
</html>
