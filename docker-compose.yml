services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-estate_automate}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-estate_automate}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api.dev
    ports:
      - "8085:8085"
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-estate_automate}
      - DB_PORT=5432
      - REDIS_ADDR=redis:6379
      - PORT=8085
      - BROWSER_PROFILES_DIR=/data/browser-profiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker.dev
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-estate_automate}
      - DB_PORT=5432
      - REDIS_ADDR=redis:6379
      - BROWSER_PROFILES_DIR=/data/browser-profiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  browser-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.browser.dev
    ports:
      - "6080:6080"
      - "9223:9223"
    volumes:
      - browser_profiles:/data/browser-profiles
      - ./backend:/app
    environment:
      - BROWSER_PROFILES_DIR=/data/browser-profiles
      - DISPLAY=:99
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9223/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8085

volumes:
  pgdata:
  redisdata:
  browser_profiles:
