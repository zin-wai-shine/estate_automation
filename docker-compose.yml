services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-estate_automate}
    ports:
      - "127.0.0.1:${HOST_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-estate_automate}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bolthaven_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bolthaven_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api.dev
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-estate_automate}
      - DB_PORT=5432
      - REDIS_ADDR=redis:6379
      - PORT=8085
      - BROWSER_PROFILES_DIR=/data/browser-profiles
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-4o}
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      - OPENAI_RESPONSES_MODEL=${OPENAI_RESPONSES_MODEL:-gpt-5.6}
      - LAOZHANG_API_KEY=${LAOZHANG_API_KEY}
      - LAOZHANG_BASE_URL=${LAOZHANG_BASE_URL:-https://api.laozhang.ai/v1}
      - LAOZHANG_MODEL=${LAOZHANG_MODEL:-deepseek-v3}
      - RUNWARE_API_KEY=${RUNWARE_API_KEY}
      - RUNWARE_MODEL=${RUNWARE_MODEL:-runware:100@1}
      - BROWSER_WORKER_HOST=host.docker.internal
      - META_APP_ID=${META_APP_ID:-967687235797751}
      - META_APP_SECRET=${META_APP_SECRET}
      - FACEBOOK_PAGE_ID=${FACEBOOK_PAGE_ID:-1287202894475973}
      - FACEBOOK_PAGE_ACCESS_TOKEN=${FACEBOOK_PAGE_ACCESS_TOKEN}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v26.0}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://app.bolthavenproperty.com}
      - TIKTOK_ENVIRONMENT=${TIKTOK_ENVIRONMENT:-sandbox}
      - N8N_BASE_URL=${N8N_BASE_URL:-http://n8n:5678}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-bolthaven_webhook_secret_change_me_2026}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bolthaven_net

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker.dev
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-estate_automate}
      - DB_PORT=5432
      - REDIS_ADDR=redis:6379
      - BROWSER_PROFILES_DIR=/data/browser-profiles
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-4o}
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      - OPENAI_RESPONSES_MODEL=${OPENAI_RESPONSES_MODEL:-gpt-5.6}
      - RUNWARE_API_KEY=${RUNWARE_API_KEY}
      - RUNWARE_MODEL=${RUNWARE_MODEL:-runware:100@1}
      - BROWSER_WORKER_HOST=host.docker.internal
      - META_APP_ID=${META_APP_ID:-967687235797751}
      - META_APP_SECRET=${META_APP_SECRET}
      - FACEBOOK_PAGE_ID=${FACEBOOK_PAGE_ID:-1287202894475973}
      - FACEBOOK_PAGE_ACCESS_TOKEN=${FACEBOOK_PAGE_ACCESS_TOKEN}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v26.0}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://app.bolthavenproperty.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bolthaven_net

  browser-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.browser.dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:9223:9223"
    volumes:
      - browser_profiles:/data/browser-profiles
      - ./backend:/app
    environment:
      - BROWSER_PROFILES_DIR=/data/browser-profiles
      - DISPLAY=:99
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9223/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bolthaven_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${HOST_FRONTEND_PORT:-5174}:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8085
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5174 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - bolthaven_net

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HOST_PROXY_PORT:-80}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - bolthaven_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      proxy:
        condition: service_healthy
    networks:
      - bolthaven_net

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - GENERIC_TIMEZONE=${N8N_TIMEZONE:-Asia/Bangkok}
      - TZ=${N8N_TIMEZONE:-Asia/Bangkok}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-bolthaven_n8n_enc_key_change_me_2026}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-BoltHaven2026!}
      - N8N_API_DISABLED=false
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - EXECUTIONS_DATA_MAX_AGE=720
      - N8N_LOG_LEVEL=info
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_RUNNERS_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - bolthaven_net

networks:
  bolthaven_net:
    name: bolthaven_net
    driver: bridge

volumes:
  pgdata:
  redisdata:
  browser_profiles:
  n8n_data:
