services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-estate_automate}
    ports:
      - "127.0.0.1:${HOST_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-estate_automate}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api.dev
    ports:
      - "8085:8085"
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-estate_automate}
      - DB_PORT=5432
      - REDIS_ADDR=redis:6379
      - PORT=8085
      - BROWSER_PROFILES_DIR=/data/browser-profiles
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-4o}
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      - OPENAI_RESPONSES_MODEL=${OPENAI_RESPONSES_MODEL:-gpt-5.6}
      - LAOZHANG_API_KEY=${LAOZHANG_API_KEY}
      - LAOZHANG_BASE_URL=${LAOZHANG_BASE_URL:-https://api.laozhang.ai/v1}
      - LAOZHANG_MODEL=${LAOZHANG_MODEL:-deepseek-v3}
      - RUNWARE_API_KEY=${RUNWARE_API_KEY}
      - RUNWARE_MODEL=${RUNWARE_MODEL:-runware:100@1}
      - BROWSER_WORKER_HOST=host.docker.internal
      - META_APP_ID=${META_APP_ID:-967687235797751}
      - META_APP_SECRET=${META_APP_SECRET}
      - FACEBOOK_PAGE_ID=${FACEBOOK_PAGE_ID:-1287202894475973}
      - FACEBOOK_PAGE_ACCESS_TOKEN=${FACEBOOK_PAGE_ACCESS_TOKEN}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v26.0}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://app.bolthavenproperty.com}
      - TIKTOK_ENVIRONMENT=${TIKTOK_ENVIRONMENT:-sandbox}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker.dev
    volumes:
      - ./backend:/app
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-estate_automate}
      - DB_PORT=5432
      - REDIS_ADDR=redis:6379
      - BROWSER_PROFILES_DIR=/data/browser-profiles
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-4o}
      - OPENAI_IMAGE_MODEL=${OPENAI_IMAGE_MODEL:-gpt-image-2.5-sunburst}
      - OPENAI_RESPONSES_MODEL=${OPENAI_RESPONSES_MODEL:-gpt-5.6}
      - RUNWARE_API_KEY=${RUNWARE_API_KEY}
      - RUNWARE_MODEL=${RUNWARE_MODEL:-runware:100@1}
      - BROWSER_WORKER_HOST=host.docker.internal
      - META_APP_ID=${META_APP_ID:-967687235797751}
      - META_APP_SECRET=${META_APP_SECRET}
      - FACEBOOK_PAGE_ID=${FACEBOOK_PAGE_ID:-1287202894475973}
      - FACEBOOK_PAGE_ACCESS_TOKEN=${FACEBOOK_PAGE_ACCESS_TOKEN}
      - META_GRAPH_API_VERSION=${META_GRAPH_API_VERSION:-v26.0}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-https://app.bolthavenproperty.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  browser-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.browser.dev
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:9223:9223"
    volumes:
      - browser_profiles:/data/browser-profiles
      - ./backend:/app
    environment:
      - BROWSER_PROFILES_DIR=/data/browser-profiles
      - DISPLAY=:99
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9223/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${HOST_FRONTEND_PORT:-5174}:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8085

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HOST_PROXY_PORT:-80}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - run
    depends_on:
      - proxy


volumes:
  pgdata:
  redisdata:
  browser_profiles:
