services:
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "proxy:80"
      - "--url=https://${NGROK_DOMAIN:-valeri-sunback-janay.ngrok-free.dev}"
    depends_on:
      - proxy
    networks:
      - default
